<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Defender | Behzad Mousavi Hub</title>
    
    <!-- ✅ FONTS & ICONS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-primary: #0a1628;
            --accent: #d4af37;
            --accent-light: #f4d06f;
            --text-primary: #e8eef7;
            --text-secondary: #a0aec0;
            
            /* ✅ NAVIGATION VARIABLES */
            --nav-height: 70px;
            --nav-bg: rgba(10, 10, 12, 0.95);
            --border: rgba(212, 175, 55, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: calc(var(--nav-height) + 20px); /* Reduced top padding */
            background-image: radial-gradient(circle at top right, rgba(212, 175, 55, 0.05), transparent 50%);
            overflow: hidden;
        }

        /* ✅ UNIFIED NAVIGATION BAR STYLES */
        nav {
            position: fixed; top: 0; left: 0; width: 100%; height: var(--nav-height);
            background: var(--nav-bg); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border); z-index: 1000;
            display: flex; align-items: center; justify-content: space-between; padding: 0 5%;
        }
        .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--accent); font-weight: 700; font-size: 1.2rem; }
        .nav-logo img { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--accent); }
        .nav-links { display: flex; gap: 1.5rem; list-style: none; align-items: center; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }
        .btn-signin { display: inline-flex !important; align-items: center; gap: 8px; padding: 0.6rem 1.5rem !important; border: 1px solid var(--accent); border-radius: 50px; color: var(--accent) !important; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: all 0.3s ease; white-space: nowrap; }
        .btn-signin:hover { background: var(--accent); color: var(--bg-primary) !important; box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
        .mobile-menu-btn { display: none; background: none; border: none; color: var(--text-primary); font-size: 1.5rem; cursor: pointer; }

        /* ✅ GAME CONTAINER STYLES - COMPACTED */
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px; /* Reduced gap */
            width: 100%;
            max-width: 600px;
            padding: 0 20px;
            position: relative;
        }

        .game-header { text-align: center; }
        .game-header h1 {
            font-size: 1.8rem; /* Slightly smaller title */
            color: var(--accent); text-transform: uppercase;
            letter-spacing: 2px; margin-bottom: 2px; 
            text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }
        .score-board { font-size: 1.1rem; color: var(--text-secondary); font-weight: 600; margin-bottom: 0; }
        .score-board span { color: var(--accent-light); font-size: 1.3rem; }

        /* ✅ GAME AREA WITH VINTAGE FRAME - REDUCED HEIGHT */
        #game-area {
            position: relative;
            width: 100%;
            max-width: 600px;
            height: 400px; /* ✅ CHANGED FROM 500px TO 400px */
            background: linear-gradient(to bottom, #02060d 0%, #0a1628 100%);
            border: 4px double var(--accent); 
            border-radius: 4px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 0 20px rgba(212, 175, 55, 0.15);
            overflow: hidden;
            touch-action: none;
        }

        /* ✅ SVG SPACESHIP CHARACTER */
        #player {
            position: absolute;
            bottom: 15px; /* Adjusted for smaller height */
            left: 50%;
            transform: translateX(-50%);
            width: 36px; /* Slightly smaller ship */
            height: 36px;
            z-index: 5;
            filter: drop-shadow(0 0 10px rgba(212, 175, 55, 0.8));
            transition: left 0.05s linear;
        }

        /* ✅ PROJECTILES & ENEMIES */
        .bullet {
            position: absolute;
            width: 4px;
            height: 12px;
            background: var(--accent-light);
            border-radius: 2px;
            box-shadow: 0 0 8px var(--accent);
            z-index: 4;
        }

        .enemy {
            position: absolute;
            width: 28px; /* Slightly smaller enemies */
            height: 28px;
            background: #0f1f38;
            border: 2px solid var(--accent);
            transform: rotate(45deg);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
            z-index: 3;
        }

        /* ✅ PARTICLE EXPLOSION */
        .particle {
            position: absolute;
            width: 4px;
            height: 4px;
            background: var(--accent);
            border-radius: 50%;
            pointer-events: none;
            z-index: 6;
        }

        /* ✅ UNIFIED START BUTTON STYLE */
        .start-btn {
            margin-top: 10px; /* Reduced margin */
            padding: 10px 28px; /* Slightly compact button */
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            color: var(--bg-primary); border: none; border-radius: 50px;
            font-size: 1rem; font-weight: 800; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            display: flex; align-items: center; gap: 8px;
        }
        .start-btn:hover { transform: translateY(-3px) scale(1.05); box-shadow: 0 8px 25px rgba(212, 175, 55, 0.6); }
        .start-btn:active { transform: translateY(-1px); }

        .controls-hint { font-size: 0.75rem; color: var(--text-secondary); opacity: 0.7; margin-top: 5px; }

        /* ✅ GAME OVER OVERLAY */
        #game-over-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 22, 40, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 10;
            backdrop-filter: blur(2px);
        }
        #game-over-screen h2 { color: var(--accent); font-size: 2.5rem; margin-bottom: 10px; text-shadow: 0 0 20px var(--accent); }
        #game-over-screen p { color: #fff; font-size: 1.3rem; }

        @media (max-width: 768px) {
            .nav-links { display: none; } .mobile-menu-btn { display: block; }
            .game-header h1 { font-size: 1.4rem; } 
            .game-wrapper { max-width: 95%; }
            #game-area { height: 350px; } /* Even smaller on mobile */
            #player { width: 30px; height: 30px; bottom: 10px; }
        }
    </style>
</head>
<body>

    <!-- ✅ YOUR UNIFIED NAVIGATION BAR -->
    <nav>
        <a href="https://sbmousavices.github.io/Industrial-Tools/EnglishInfo.html" class="nav-logo">
            <img src="https://sbmousavices.github.io/Industrial-Tools/icon-192.png" alt="BM Planning Logo"><span>Home</span>
        </a>
        <ul class="nav-links">
            <li><a href="https://sbmousavices.github.io/Resume/Resume_Builder_English.html">Resume Builder</a></li>
            <li><a href="https://sbmousavices.github.io/Theme/index.html">Web Design</a></li>
            <li><a href="https://sbmousavices.github.io/NFT/">NFT Gallery</a></li>
            <li><a href="https://sbmousavices.github.io/Industrial-Tools/">Products</a></li>
            <li><a href="https://sbmousavices.github.io/Articles/">Articles</a></li>
            <li><a href="https://sbmousavices.github.io/Industrial-Tools/Community.html">Community</a></li>
            <li><a href="hub.html" class="active">Hub</a></li>
            <li><a href="https://sbmousavices.github.io/Industrial-Tools/EnglishInfo.html#contact">Contact</a></li>
            <li><a href="https://sbmousavices.github.io/Industrial-Tools/EnglishInfo.html" class="btn-signin"><i class="fas fa-user"></i> Sign In</a></li>
        </ul>
        <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
    </nav>

    <!-- ✅ GAME AREA -->
    <div class="game-wrapper">
        <div class="game-header">
            <h1><i class="fas fa-rocket"></i> Gold Defender</h1>
            <div class="score-board">Score: <span id="score">0</span></div>
        </div>
        
        <div id="game-area">
            <!-- ✅ CUSTOM SVG SPACESHIP -->
            <div id="player">
                <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
                    <path d="M50 10 L80 70 L50 60 L20 70 Z" fill="#d4af37" stroke="#f4d06f" stroke-width="2"/>
                    <circle cx="50" cy="75" r="8" fill="#f4d06f" opacity="0.8"/>
                    <path d="M20 70 L10 85 L30 75 Z" fill="#d4af37"/>
                    <path d="M80 70 L90 85 L70 75 Z" fill="#d4af37"/>
                </svg>
            </div>
            
            <div id="game-over-screen">
                <h2>GAME OVER</h2>
                <p>Final Score: <span id="final-score">0</span></p>
            </div>
        </div>
        
        <button id="startBtn" class="start-btn"><i class="fas fa-play"></i> Start Mission</button>
        <div class="controls-hint">Move Mouse/Touch to Aim • Auto-Fire Enabled</div>
    </div>

    <!-- ✅ COMPLETE JAVASCRIPT LOGIC -->
    <script>
        const gameArea = document.getElementById('game-area');
        const player = document.getElementById('player');
        const scoreElement = document.getElementById('score');
        const finalScoreElement = document.getElementById('final-score');
        const gameOverScreen = document.getElementById('game-over-screen');
        const startBtn = document.getElementById('startBtn');

        // Game State
        let score = 0;
        let isGameRunning = false;
        let animationId;
        let lastShotTime = 0;
        let enemySpawnTimer = 0;
        let difficultyMultiplier = 1;

        // Entities Arrays
        let bullets = [];
        let enemies = [];
        let particles = [];

        // Player Position (Normalized 0-1)
        let playerPos = 0.5; 

        // Start Button Event Listener
        startBtn.addEventListener('click', () => {
            resetGame();
            isGameRunning = true;
            startBtn.innerHTML = '<i class="fas fa-redo"></i> Restart';
            startBtn.blur();
            startGame();
        });

        function startGame() {
            cancelAnimationFrame(animationId);
            gameLoop();
            
            gameArea.addEventListener('mousemove', handleInput);
            gameArea.addEventListener('touchmove', (e) => {
                e.preventDefault();
                handleInput(e.touches[0]);
            }, {passive: false});
        }

        function handleInput(e) {
            if (!isGameRunning) return;
            const rect = gameArea.getBoundingClientRect();
            const x = e.clientX - rect.left;
            playerPos = Math.max(0.05, Math.min(0.95, x / rect.width));
            player.style.left = `${playerPos * 100}%`;
        }

        function createBullet() {
            const bullet = document.createElement('div');
            bullet.className = 'bullet';
            
            const playerRect = player.getBoundingClientRect();
            const areaRect = gameArea.getBoundingClientRect();
            
            const startX = playerRect.left - areaRect.left + (playerRect.width / 2) - 2;
            const startY = playerRect.top - areaRect.top;

            bullet.style.left = `${startX}px`;
            bullet.style.top = `${startY}px`;
            
            gameArea.appendChild(bullet);
            bullets.push({ element: bullet, y: startY, active: true });
        }

        function createEnemy() {
            const enemy = document.createElement('div');
            enemy.className = 'enemy';
            
            const size = 28;
            const x = Math.random() * (gameArea.offsetWidth - size);
            
            enemy.style.left = `${x}px`;
            enemy.style.top = `-30px`;
            
            gameArea.appendChild(enemy);
            enemies.push({ 
                element: enemy, 
                x: x, 
                y: -30, 
                speed: (2 + Math.random() * 2) * difficultyMultiplier,
                active: true 
            });
        }

        function createExplosion(x, y) {
            for(let i=0; i<8; i++) {
                const p = document.createElement('div');
                p.className = 'particle';
                p.style.left = `${x}px`;
                p.style.top = `${y}px`;
                gameArea.appendChild(p);
                
                const angle = Math.random() * Math.PI * 2;
                const speed = 2 + Math.random() * 3;
                
                particles.push({
                    element: p,
                    x: x,
                    y: y,
                    vx: Math.cos(angle) * speed,
                    vy: Math.sin(angle) * speed,
                    life: 1.0
                });
            }
        }

        function update(timestamp) {
            if (timestamp - lastShotTime > 200) {
                createBullet();
                lastShotTime = timestamp;
            }

            enemySpawnTimer++;
            const spawnRate = Math.max(20, 60 - Math.floor(score / 50));
            if (enemySpawnTimer > spawnRate) {
                createEnemy();
                enemySpawnTimer = 0;
                difficultyMultiplier = 1 + (score / 500);
            }

            // Update Bullets
            for (let i = bullets.length - 1; i >= 0; i--) {
                let b = bullets[i];
                b.y -= 8;
                b.element.style.top = `${b.y}px`;

                if (b.y < -20) {
                    b.element.remove();
                    bullets.splice(i, 1);
                }
            }

            // Update Enemies & Collision
            const playerRect = player.getBoundingClientRect();

            for (let i = enemies.length - 1; i >= 0; i--) {
                let e = enemies[i];
                e.y += e.speed;
                e.element.style.top = `${e.y}px`;

                const eRect = e.element.getBoundingClientRect();
                if (
                    playerRect.left < eRect.right &&
                    playerRect.right > eRect.left &&
                    playerRect.top < eRect.bottom &&
                    playerRect.bottom > eRect.top
                ) {
                    gameOver();
                    return;
                }

                for (let j = bullets.length - 1; j >= 0; j--) {
                    let b = bullets[j];
                    const bRect = b.element.getBoundingClientRect();
                    
                    if (
                        bRect.left < eRect.right &&
                        bRect.right > eRect.left &&
                        bRect.top < eRect.bottom &&
                        bRect.bottom > eRect.top
                    ) {
                        createExplosion(e.x + 14, e.y + 14);
                        e.element.remove();
                        enemies.splice(i, 1);
                        
                        b.element.remove();
                        bullets.splice(j, 1);
                        
                        score += 10;
                        scoreElement.innerText = score;
                        break;
                    }
                }

                if (e.y > gameArea.offsetHeight) {
                    e.element.remove();
                    enemies.splice(i, 1);
                }
            }

            // Update Particles
            for (let i = particles.length - 1; i >= 0; i--) {
                let p = particles[i];
                p.x += p.vx;
                p.y += p.vy;
                p.life -= 0.05;
                p.element.style.left = `${p.x}px`;
                p.element.style.top = `${p.y}px`;
                p.element.style.opacity = p.life;

                if (p.life <= 0) {
                    p.element.remove();
                    particles.splice(i, 1);
                }
            }
        }

        function gameLoop(timestamp) {
            if (!isGameRunning) return;
            update(timestamp || 0);
            animationId = requestAnimationFrame(gameLoop);
        }

        function gameOver() {
            isGameRunning = false;
            cancelAnimationFrame(animationId);
            
            finalScoreElement.innerText = score;
            gameOverScreen.style.display = 'flex';
            startBtn.innerHTML = '<i class="fas fa-play"></i> Try Again';
        }

        function resetGame() {
            score = 0;
            difficultyMultiplier = 1;
            scoreElement.innerText = score;
            
            bullets.forEach(b => b.element.remove());
            enemies.forEach(e => e.element.remove());
            particles.forEach(p => p.element.remove());
            bullets = [];
            enemies = [];
            particles = [];
            
            playerPos = 0.5;
            player.style.left = '50%';
            
            gameOverScreen.style.display = 'none';
        }

        resetGame();
    </script>
</body>
</html>
