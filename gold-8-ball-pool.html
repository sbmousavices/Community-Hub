    <style>
        :root {
            --bg-primary: #0a1628;
            --accent: #d4af37;
            --accent-light: #f4d06f;
            --text-primary: #e8eef7;
            --text-secondary: #a0aec0;
            
            /* ✅ NAVIGATION VARIABLES */
            --nav-height: 70px;
            --nav-bg: rgba(10, 10, 12, 0.95);
            --border: rgba(212, 175, 55, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: calc(var(--nav-height) + 20px);
            background-image: radial-gradient(circle at top right, rgba(212, 175, 55, 0.05), transparent 50%);
            overflow-x: hidden;
            touch-action: pan-y;
        }

        /* ✅ UNIFIED NAVIGATION BAR STYLES */
        nav {
            position: fixed; top: 0; left: 0; width: 100%; height: var(--nav-height);
            background: var(--nav-bg); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border); z-index: 1000;
            display: flex; align-items: center; justify-content: space-between; padding: 0 5%;
        }
        .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--accent); font-weight: 700; font-size: 1.2rem; }
        .nav-logo img { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--accent); }
        .nav-links { display: flex; gap: 1.5rem; list-style: none; align-items: center; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }
        .btn-signin { display: inline-flex !important; align-items: center; gap: 8px; padding: 0.6rem 1.5rem !important; border: 1px solid var(--accent); border-radius: 50px; color: var(--accent) !important; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: all 0.3s ease; white-space: nowrap; }
        .btn-signin:hover { background: var(--accent); color: var(--bg-primary) !important; box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
        .mobile-menu-btn { display: none; background: none; border: none; color: var(--text-primary); font-size: 1.5rem; cursor: pointer; }

        /* ✅ BACK TO MAIN PAGE BUTTON (TOP RIGHT) */
        .back-to-main-btn {
            position: fixed;
            top: calc(var(--nav-height) + 15px);
            right: 5%;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--accent);
            border-radius: 50px;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            z-index: 900;
        }
        .back-to-main-btn:hover {
            background: var(--accent);
            color: var(--bg-primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .back-to-main-btn i { font-size: 0.85rem; }

        /* ✅ GAME CONTAINER STYLES - LARGER FOR DESKTOP */
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 900px; /* ✅ INCREASED MAX WIDTH FOR DESKTOP */
            padding: 0 20px;
            position: relative;
        }

        .game-header { text-align: center; }
        .game-header h1 {
            font-size: 1.8rem; color: var(--accent); text-transform: uppercase;
            letter-spacing: 2px; margin-bottom: 5px; text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        /* ✅ STATS BAR */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            width: 100%;
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 8px 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .stat-item span { color: var(--accent-light); margin-left: 4px; }

        /* ✅ POOL TABLE CANVAS - RESPONSIVE */
        #pool-canvas {
            width: 100%;
            max-width: 860px; /* ✅ MATCHES WRAPPER PADDING */
            aspect-ratio: 2 / 1; 
            background: #0f2a1d; 
            border: 8px solid #1a1a1a; 
            border-radius: 12px;
            box-shadow: inset 0 0 40px rgba(0,0,0,0.6), 0 0 20px rgba(212, 175, 55, 0.15);
            touch-action: none; 
            cursor: crosshair;
            display: block;
        }

        /* ✅ ACTION BUTTONS ROW */
        .actions-row {
            display: flex;
            gap: 10px;
            width: 100%;
            justify-content: center;
            margin-top: 5px;
        }

        .action-btn {
            padding: 10px 20px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            color: var(--bg-primary); border: none; border-radius: 50px;
            font-size: 1rem; font-weight: 800; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            display: flex; align-items: center; gap: 8px;
            flex: 1;
            max-width: 160px;
            justify-content: center;
        }
        .action-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5); }
        .action-btn:disabled { opacity: 0.5; cursor: not-allowed; filter: grayscale(1); }
        
        .action-btn.secondary {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--accent);
            color: var(--accent);
            box-shadow: none;
        }
        .action-btn.secondary:hover:not(:disabled) {
            background: rgba(212, 175, 55, 0.2);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.2);
        }

        .controls-hint { font-size: 0.7rem; color: var(--text-secondary); opacity: 0.6; margin-top: 5px; text-align: center;}

        /* ✅ WIN OVERLAY */
        #win-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 22, 40, 0.92);
            display: none; 
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 30; 
            border-radius: 12px;
            backdrop-filter: blur(5px);
            text-align: center;
            pointer-events: auto; 
        }
        
        #win-screen.active { 
            display: flex; 
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        #win-screen h2 { 
            color: var(--accent); 
            font-size: 2.2rem; 
            margin-bottom: 10px; 
            text-shadow: 0 0 20px var(--accent); 
        }
        #win-screen p { 
            color: #fff; 
            font-size: 1.1rem; 
            margin-bottom: 25px; 
        }

        @media (max-width: 768px) {
            .nav-links { display: none; } .mobile-menu-btn { display: block; }
            .game-header h1 { font-size: 1.4rem; } 
            .game-wrapper { max-width: 98%; padding: 0 10px; }
            .back-to-main-btn { top: calc(var(--nav-height) + 10px); right: 15px; padding: 6px 14px; font-size: 0.7rem; }
            .action-btn { padding: 12px 15px; font-size: 0.9rem; }
            #pool-canvas { border-width: 6px; }
        }
    </style>

    <a href="https://sbmousavices.github.io/Community-Hub/game-index.html" class="back-to-main-btn">

    </a>

    <!-- ✅ GAME AREA -->
    <div class="game-wrapper">
        <div class="game-header">
            <h1><i class="fas fa-circle-dot"></i> Gold 8-Ball</h1>
        </div>

        <div class="stats-bar">
            <div class="stat-item">Player: <span id="player-score">0</span></div>
            <div class="stat-item">Turn: <span id="turn-indicator">Your Turn</span></div>
            <div class="stat-item">CPU: <span id="cpu-score">0</span></div>
        </div>
        
        <canvas id="pool-canvas" width="860" height="430"></canvas>

        <div class="actions-row">
            <button id="newGameBtn" class="action-btn secondary"><i class="fas fa-redo"></i> New Game</button>
        </div>
        <div class="controls-hint">Drag on Cue Ball to Aim • Release to Shoot</div>

        <!-- ✅ WIN OVERLAY -->
        <div id="win-screen">
            <h2 id="result-title">YOU WIN!</h2>
            <p id="result-msg">Excellent shot!</p>
            <button id="playAgainBtn" class="action-btn"><i class="fas fa-play"></i> Play Again</button>
        </div>
    </div>

    <!-- ✅ JAVASCRIPT LOGIC WITH ACTIVE CPU AI -->
    <script>
        const canvas = document.getElementById('pool-canvas');
        const ctx = canvas.getContext('2d');
        const playerScoreEl = document.getElementById('player-score');
        const cpuScoreEl = document.getElementById('cpu-score');
        const turnIndicator = document.getElementById('turn-indicator');
        const winScreen = document.getElementById('win-screen');
        const resultTitle = document.getElementById('result-title');
        const resultMsg = document.getElementById('result-msg');
        const newGameBtn = document.getElementById('newGameBtn');
        const playAgainBtn = document.getElementById('playAgainBtn');

        // Game State
        let balls = [];
        let cueBall;
        let isAiming = false;
        let isShooting = false;
        let isCpuThinking = false;
        let aimStart = { x: 0, y: 0 };
        let aimCurrent = { x: 0, y: 0 };
        let friction = 0.985;
        let stopThreshold = 0.15;
        let playerTurn = true;
        let playerScore = 0;
        let cpuScore = 0;
        let animationId;
        let gameOver = false;

        // Ball Colors for 8-Ball
        const BALL_COLORS = [
            '#ffffff', '#fbbf24', '#3b82f6', '#ef4444', '#8b5cf6', 
            '#f97316', '#22c55e', '#7f1d1d', '#000000', 
            '#fbbf24', '#3b82f6', '#ef4444', '#8b5cf6', 
            '#f97316', '#22c55e', '#7f1d1d'
        ];

        function initGame() {
            balls = [];
            playerScore = 0;
            cpuScore = 0;
            playerTurn = true;
            gameOver = false;
            isCpuThinking = false;
            updateUI();
            winScreen.classList.remove('active');

            // Create Cue Ball
            cueBall = { x: 215, y: 215, vx: 0, vy: 0, radius: 12, color: BALL_COLORS[0], number: 0, active: true };
            balls.push(cueBall);

            // Rack the balls (Triangle formation)
            let startX = 600;
            let startY = 215;
            const rackPattern = [
                [1], [9, 2], [10, 8, 3], [11, 7, 14, 4], [5, 13, 12, 6, 15]
            ];

            for(let r=0; r<rackPattern.length; r++) {
                for(let c=0; c<rackPattern[r].length; c++) {
                    let num = rackPattern[r][c];
                    balls.push({
                        x: startX + (r * 22),
                        y: startY - ((rackPattern[r].length-1)*11) + (c * 22),
                        vx: 0, vy: 0,
                        radius: 12,
                        color: BALL_COLORS[num],
                        number: num,
                        active: true
                    });
                }
            }

            startAnimationLoop();
        }

        function startAnimationLoop() {
            if(animationId) cancelAnimationFrame(animationId);
            function loop() {
                updatePhysics();
                draw();
                animationId = requestAnimationFrame(loop);
            }
            loop();
        }

        function updatePhysics() {
            let moving = false;
            
            for(let i=0; i<balls.length; i++) {
                let b = balls[i];
                if(!b.active) continue;

                b.x += b.vx;
                b.y += b.vy;
                b.vx *= friction;
                b.vy *= friction;

                if(Math.abs(b.vx) > stopThreshold || Math.abs(b.vy) > stopThreshold) {
                    moving = true;
                } else {
                    b.vx = 0; b.vy = 0;
                }

                // Wall Collisions
                if(b.x - b.radius < 45) { b.x = 45 + b.radius; b.vx *= -0.8; }
                if(b.x + b.radius > canvas.width - 45) { b.x = canvas.width - 45 - b.radius; b.vx *= -0.8; }
                if(b.y - b.radius < 45) { b.y = 45 + b.radius; b.vy *= -0.8; }
                if(b.y + b.radius > canvas.height - 45) { b.y = canvas.height - 45 - b.radius; b.vy *= -0.8; }

                // Pocket Detection
                const pockets = [
                    {x: 35, y: 35}, {x: canvas.width/2, y: 30}, {x: canvas.width-35, y: 35},
                    {x: 35, y: canvas.height-35}, {x: canvas.width/2, y: canvas.height-30}, {x: canvas.width-35, y: canvas.height-35}
                ];

                for(let p of pockets) {
                    let dist = Math.hypot(b.x - p.x, b.y - p.y);
                    if(dist < 28) {
                        b.active = false;
                        b.vx = 0; b.vy = 0;
                        handlePocketedBall(b);
                    }
                }
            }

            // Ball to Ball Collisions
            for(let i=0; i<balls.length; i++) {
                for(let j=i+1; j<balls.length; j++) {
                    let b1 = balls[i], b2 = balls[j];
                    if(!b1.active || !b2.active) continue;
                    
                    let dx = b2.x - b1.x;
                    let dy = b2.y - b1.y;
                    let dist = Math.hypot(dx, dy);
                    let minDist = b1.radius + b2.radius;

                    if(dist < minDist && dist > 0) {
                        // Resolve overlap
                        let angle = Math.atan2(dy, dx);
                        let targetX = b1.x + Math.cos(angle) * minDist;
                        let targetY = b1.y + Math.sin(angle) * minDist;
                        let ax = (targetX - b2.x) * 0.5;
                        let ay = (targetY - b2.y) * 0.5;
                        
                        b1.x -= ax; b1.y -= ay;
                        b2.x += ax; b2.y += ay;

                        // Elastic collision
                        let v1 = {x: b1.vx, y: b1.vy};
                        let v2 = {x: b2.vx, y: b2.vy};
                        
                        b1.vx = v2.x; b1.vy = v2.y;
                        b2.vx = v1.x; b2.vy = v1.y;
                    }
                }
            }

            // Check turn end
            if(isShooting && !moving) {
                isShooting = false;
                checkTurnEnd();
            }
            
            // Trigger CPU if it's their turn and balls stopped
            if(!playerTurn && !isShooting && !isCpuThinking && !gameOver) {
                isCpuThinking = true;
                setTimeout(cpuPlay, 1000);
            }
        }

        function handlePocketedBall(ball) {
            if(ball.number === 0) {
                // Cue ball pocketed - foul
                setTimeout(() => {
                    if(!gameOver) {
                        ball.active = true;
                        ball.x = 215; ball.y = 215;
                        ball.vx = 0; ball.vy = 0;
                    }
                }, 500);
            } else if(ball.number === 8) {
                // 8-ball pocketed
                gameOver = true;
                if(playerTurn) endGame('YOU WIN!', 'You sank the 8-ball!');
                else endGame('CPU WINS!', 'CPU sank the 8-ball!');
            } else {
                if(playerTurn) { playerScore++; updateUI(); }
                else { cpuScore++; updateUI(); }
            }
        }

        function checkTurnEnd() {
            if(!gameOver) {
                playerTurn = !playerTurn;
                updateUI();
            }
        }

        function updateUI() {
            playerScoreEl.innerText = playerScore;
            cpuScoreEl.innerText = cpuScore;
            turnIndicator.innerText = playerTurn ? "Your Turn" : "CPU Thinking...";
            turnIndicator.style.color = playerTurn ? "var(--accent-light)" : "#ef4444";
        }

        function endGame(title, msg) {
            resultTitle.innerText = title;
            resultMsg.innerText = msg;
            winScreen.classList.add('active');
        }

        function draw() {
            // Clear Canvas
            ctx.fillStyle = '#0f2a1d';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Pockets
            ctx.fillStyle = '#000';
            const pockets = [
                {x: 35, y: 35}, {x: canvas.width/2, y: 30}, {x: canvas.width-35, y: 35},
                {x: 35, y: canvas.height-35}, {x: canvas.width/2, y: canvas.height-30}, {x: canvas.width-35, y: canvas.height-35}
            ];
            pockets.forEach(p => {
                ctx.beginPath(); ctx.arc(p.x, p.y, 25, 0, Math.PI*2); ctx.fill();
            });

            // Draw Rails
            ctx.strokeStyle = '#1a1a1a';
            ctx.lineWidth = 10;
            ctx.strokeRect(40, 40, canvas.width-80, canvas.height-80);

            // Draw Balls
            balls.forEach(b => {
                if(!b.active) return;
                
                // Shadow
                ctx.beginPath();
                ctx.arc(b.x + 2, b.y + 2, b.radius, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(0,0,0,0.4)';
                ctx.fill();

                // Ball Body
                ctx.beginPath();
                ctx.arc(b.x, b.y, b.radius, 0, Math.PI*2);
                ctx.fillStyle = b.color;
                ctx.fill();

                // Shine effect
                ctx.beginPath();
                ctx.arc(b.x - 3, b.y - 3, 3, 0, Math.PI*2);
                ctx.fillStyle = 'rgba(255,255,255,0.3)';
                ctx.fill();

                // Number circle for non-cue balls
                if(b.number !== 0) {
                    ctx.beginPath();
                    ctx.arc(b.x, b.y, 6, 0, Math.PI*2);
                    ctx.fillStyle = '#fff';
                    ctx.fill();
                    
                    ctx.fillStyle = '#000';
                    ctx.font = 'bold 8px Inter';
                    ctx.textAlign = 'center';
                    ctx.textBaseline = 'middle';
                    ctx.fillText(b.number, b.x, b.y);
                }
            });

            // Draw Aim Line
            if(isAiming && cueBall.active && !isShooting && !isCpuThinking) {
                ctx.beginPath();
                ctx.moveTo(cueBall.x, cueBall.y);
                let dx = aimStart.x - aimCurrent.x;
                let dy = aimStart.y - aimCurrent.y;
                ctx.lineTo(cueBall.x + dx * 3, cueBall.y + dy * 3);
                ctx.strokeStyle = 'rgba(244, 208, 111, 0.6)';
                ctx.lineWidth = 2;
                ctx.setLineDash([5, 5]);
                ctx.stroke();
                ctx.setLineDash([]);
            }
        }

        // ✅ CPU AI LOGIC
        function cpuPlay() {
            if(gameOver || !cueBall.active) { isCpuThinking = false; return; }

            // Find active object balls
            let targets = balls.filter(b => b.active && b.number !== 0 && b.number !== 8);
            if(targets.length === 0) targets = balls.filter(b => b.active && b.number === 8);
            
            if(targets.length > 0) {
                // Pick a random target
                let target = targets[Math.floor(Math.random() * targets.length)];
                
                // Calculate angle to hit target
                let dx = target.x - cueBall.x;
                let dy = target.y - cueBall.y;
                let angle = Math.atan2(dy, dx);
                
                // Add slight randomness to make it human-like
                angle += (Math.random() - 0.5) * 0.1;
                
                // Set power
                let power = 12 + Math.random() * 8;
                
                // Shoot
                cueBall.vx = Math.cos(angle) * power;
                cueBall.vy = Math.sin(angle) * power;
                isShooting = true;
            } else {
                // No targets, just shoot randomly
                let angle = Math.random() * Math.PI * 2;
                cueBall.vx = Math.cos(angle) * 10;
                cueBall.vy = Math.sin(angle) * 10;
                isShooting = true;
            }
            
            isCpuThinking = false;
        }

        // ✅ MOBILE & DESKTOP TOUCH/MOUSE HANDLING
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return {
                x: (clientX - rect.left) * scaleX,
                y: (clientY - rect.top) * scaleY
            };
        }

        function startAim(e) {
            if(isShooting || !cueBall.active || !playerTurn || isCpuThinking || gameOver) return;
            const pos = getPos(e);
            if(Math.hypot(pos.x - cueBall.x, pos.y - cueBall.y) < 40) {
                isAiming = true;
                aimStart = pos;
                aimCurrent = pos;
                if(e.cancelable) e.preventDefault();
            }
        }

        function moveAim(e) {
            if(!isAiming) return;
            aimCurrent = getPos(e);
            if(e.cancelable) e.preventDefault();
        }

        function endAim(e) {
            if(!isAiming) return;
            isAiming = false;
            shoot();
            if(e.cancelable) e.preventDefault();
        }

        function shoot() {
            let dx = aimStart.x - aimCurrent.x;
            let dy = aimStart.y - aimCurrent.y;
            let power = Math.min(Math.hypot(dx, dy), 150) * 0.18;
            let angle = Math.atan2(dy, dx);
            
            cueBall.vx = Math.cos(angle) * power;
            cueBall.vy = Math.sin(angle) * power;
            isShooting = true;
        }

        // Mouse Events
        canvas.addEventListener('mousedown', startAim);
        canvas.addEventListener('mousemove', moveAim);
        canvas.addEventListener('mouseup', endAim);
        canvas.addEventListener('mouseleave', () => { if(isAiming) { isAiming = false; } });

        // Touch Events
        canvas.addEventListener('touchstart', startAim, {passive: false});
        canvas.addEventListener('touchmove', moveAim, {passive: false});
        canvas.addEventListener('touchend', endAim, {passive: false});

        newGameBtn.addEventListener('click', initGame);
        playAgainBtn.addEventListener('click', initGame);

        // Init
        initGame();
    </script>
</body>
</html>
