<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Sliding Puzzle | Behzad Mousavi Hub</title>
    
    <!-- ✅ FONTS & ICONS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-primary: #0a1628;
            --accent: #d4af37;
            --accent-light: #f4d06f;
            --text-primary: #e8eef7;
            --text-secondary: #a0aec0;
            
            /* ✅ NAVIGATION VARIABLES */
            --nav-height: 70px;
            --nav-bg: rgba(10, 10, 12, 0.95);
            --border: rgba(212, 175, 55, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: calc(var(--nav-height) + 20px);
            background-image: radial-gradient(circle at top right, rgba(212, 175, 55, 0.05), transparent 50%);
            overflow-x: hidden;
        }

        /* ✅ UNIFIED NAVIGATION BAR STYLES */
        nav {
            position: fixed; top: 0; left: 0; width: 100%; height: var(--nav-height);
            background: var(--nav-bg); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border); z-index: 1000;
            display: flex; align-items: center; justify-content: space-between; padding: 0 5%;
        }
        .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--accent); font-weight: 700; font-size: 1.2rem; }
        .nav-logo img { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--accent); }
        .nav-links { display: flex; gap: 1.5rem; list-style: none; align-items: center; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }
        .btn-signin { display: inline-flex !important; align-items: center; gap: 8px; padding: 0.6rem 1.5rem !important; border: 1px solid var(--accent); border-radius: 50px; color: var(--accent) !important; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: all 0.3s ease; white-space: nowrap; }
        .btn-signin:hover { background: var(--accent); color: var(--bg-primary) !important; box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
        .mobile-menu-btn { display: none; background: none; border: none; color: var(--text-primary); font-size: 1.5rem; cursor: pointer; }

        /* ✅ GAME CONTAINER STYLES */
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            padding: 0 20px;
            position: relative;
        }

        .game-header { text-align: center; }
        .game-header h1 {
            font-size: 1.8rem; color: var(--accent); text-transform: uppercase;
            letter-spacing: 2px; margin-bottom: 5px; text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        /* ✅ STATS BAR */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            width: 100%;
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 8px 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .stat-item span { color: var(--accent-light); margin-left: 4px; }

        /* ✅ PUZZLE GRID */
        .puzzle-container {
            position: relative;
            width: 320px;
            height: 320px;
            border: 4px double var(--accent);
            border-radius: 8px;
            background: #050b14;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 0 20px rgba(212, 175, 55, 0.15);
            overflow: hidden;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 4px;
            padding: 4px;
        }

        .tile {
            background: linear-gradient(135deg, #1a2b4c, #2d4a7c);
            border: 1px solid var(--accent);
            border-radius: 6px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--accent-light);
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
        }

        .tile:hover:not(.empty) {
            transform: scale(0.95);
            background: linear-gradient(135deg, #2d4a7c, #3b5998);
            box-shadow: 0 0 10px rgba(212, 175, 55, 0.4);
        }

        .tile.empty {
            background: transparent;
            border: none;
            box-shadow: none;
            cursor: default;
        }

        .tile.correct {
            background: linear-gradient(135deg, #d4af37, #f4d06f);
            color: #0a1628;
            border-color: #fff;
        }

        /* ✅ ACTION BUTTON */
        .action-btn {
            margin-top: 15px; padding: 10px 30px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            color: var(--bg-primary); border: none; border-radius: 50px;
            font-size: 1rem; font-weight: 800; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            display: flex; align-items: center; gap: 8px;
        }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5); }

        .controls-hint { font-size: 0.7rem; color: var(--text-secondary); opacity: 0.6; margin-top: 5px; text-align: center;}

        /* ✅ WIN OVERLAY */
        #win-screen {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 22, 40, 0.95);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            text-align: center;
        }
        #win-screen h2 { color: var(--accent); font-size: 2rem; margin-bottom: 10px; text-shadow: 0 0 20px var(--accent); }
        #win-screen p { color: #fff; font-size: 1rem; margin-bottom: 20px; line-height: 1.6; }

        @media (max-width: 768px) {
            .nav-links { display: none; } .mobile-menu-btn { display: block; }
            .game-header h1 { font-size: 1.4rem; } 
            .puzzle-container { width: 280px; height: 280px; }
            .tile { font-size: 1.2rem; }
        }
    </style>
</head>
<body>

    <!-- ✅ NAVIGATION BAR -->
    <nav>
        <a href="https://sbmousavices.github.io/Industrial-Tools/EnglishInfo.html" class="nav-logo">
            <img src="https://sbmousavices.github.io/Industrial-Tools/icon-192.png" alt="Logo"><span>Home</span>
        </a>
        <ul class="nav-links">
            <li><a href="hub.html" class="active">Hub</a></li>
            <li><a href="https://sbmousavices.github.io/Industrial-Tools/EnglishInfo.html" class="btn-signin"><i class="fas fa-user"></i> Sign In</a></li>
        </ul>
        <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
    </nav>

    <!-- ✅ GAME AREA -->
    <div class="game-wrapper">
        <div class="game-header">
            <h1><i class="fas fa-puzzle-piece"></i> Gold Slide</h1>
        </div>

        <div class="stats-bar">
            <div class="stat-item">Time: <span id="timer">00:00</span></div>
            <div class="stat-item">Moves: <span id="moves">0</span></div>
        </div>
        
        <div class="puzzle-container" id="puzzle">
            <!-- Tiles generated by JS -->
        </div>

        <button id="startBtn" class="action-btn"><i class="fas fa-play"></i> Start Puzzle</button>
        <div class="controls-hint">Tap tiles adjacent to the empty space to slide them</div>

        <!-- Win Screen Overlay -->
        <div id="win-screen">
            <h2>PUZZLE SOLVED!</h2>
            <p>Time: <span id="final-time">00:00</span><br>Moves: <span id="final-moves">0</span></p>
            <button id="restartBtn" class="action-btn"><i class="fas fa-redo"></i> Play Again</button>
        </div>
    </div>

    <!-- ✅ JAVASCRIPT LOGIC -->
    <script>
        const puzzleEl = document.getElementById('puzzle');
        const timerEl = document.getElementById('timer');
        const movesEl = document.getElementById('moves');
        const startBtn = document.getElementById('startBtn');
        const winScreen = document.getElementById('win-screen');
        const restartBtn = document.getElementById('restartBtn');
        const finalTimeEl = document.getElementById('final-time');
        const finalMovesEl = document.getElementById('final-moves');

        // Game State
        let tiles = [];
        let emptyIndex = 15;
        let moves = 0;
        let timer = 0;
        let timerInterval;
        let isGameActive = false;
        let isSolved = false;

        // Initialize Puzzle
        function initPuzzle() {
            puzzleEl.innerHTML = '';
            tiles = Array.from({length: 16}, (_, i) => i + 1);
            tiles[15] = 0; // 0 represents empty space
            emptyIndex = 15;
            
            renderTiles();
        }

        function renderTiles() {
            puzzleEl.innerHTML = '';
            tiles.forEach((num, index) => {
                const tile = document.createElement('div');
                tile.className = num === 0 ? 'tile empty' : 'tile';
                if (num !== 0 && num === index + 1) tile.classList.add('correct');
                tile.innerText = num === 0 ? '' : num;
                tile.addEventListener('click', () => handleTileClick(index));
                puzzleEl.appendChild(tile);
            });
        }

        function shufflePuzzle() {
            // Perform random valid moves to ensure solvability
            for (let i = 0; i < 300; i++) {
                const neighbors = getNeighbors(emptyIndex);
                const randomNeighbor = neighbors[Math.floor(Math.random() * neighbors.length)];
                swapTiles(emptyIndex, randomNeighbor);
                emptyIndex = randomNeighbor;
            }
            renderTiles();
        }

        function getNeighbors(index) {
            const row = Math.floor(index / 4);
            const col = index % 4;
            const neighbors = [];
            
            if (row > 0) neighbors.push(index - 4); // Up
            if (row < 3) neighbors.push(index + 4); // Down
            if (col > 0) neighbors.push(index - 1); // Left
            if (col < 3) neighbors.push(index + 1); // Right
            
            return neighbors;
        }

        function handleTileClick(index) {
            if (!isGameActive || isSolved) return;
            
            const neighbors = getNeighbors(emptyIndex);
            if (neighbors.includes(index)) {
                swapTiles(emptyIndex, index);
                emptyIndex = index;
                moves++;
                movesEl.innerText = moves;
                renderTiles();
                checkWin();
            }
        }

        function swapTiles(i, j) {
            [tiles[i], tiles[j]] = [tiles[j], tiles[i]];
        }

        function checkWin() {
            const isWin = tiles.every((val, index) => val === (index + 1) % 16);
            if (isWin) {
                isSolved = true;
                clearInterval(timerInterval);
                finalTimeEl.innerText = formatTime(timer);
                finalMovesEl.innerText = moves;
                setTimeout(() => winScreen.style.display = 'flex', 300);
            }
        }

        function startGame() {
            if (isGameActive) return;
            
            resetStats();
            isGameActive = true;
            isSolved = false;
            startBtn.style.display = 'none';
            winScreen.style.display = 'none';
            
            initPuzzle();
            shufflePuzzle();
            
            timerInterval = setInterval(() => {
                timer++;
                timerEl.innerText = formatTime(timer);
            }, 1000);
        }

        function resetStats() {
            clearInterval(timerInterval);
            timer = 0;
            moves = 0;
            timerEl.innerText = "00:00";
            movesEl.innerText = "0";
        }

        function formatTime(seconds) {
            const m = Math.floor(seconds / 60).toString().padStart(2, '0');
            const s = (seconds % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        // Event Listeners
        startBtn.addEventListener('click', startGame);
        restartBtn.addEventListener('click', () => {
            winScreen.style.display = 'none';
            startBtn.style.display = 'flex';
            resetStats();
            initPuzzle();
        });

        // Init
        initPuzzle();
    </script>
</body>
</html>
