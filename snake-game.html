<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gold Snake | Behzad Mousavi Hub</title>
    
    <!-- ✅ FONTS & ICONS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        :root {
            --bg-primary: #0a1628;
            --accent: #d4af37;
            --accent-light: #f4d06f;
            --text-primary: #e8eef7;
            --text-secondary: #a0aec0;
            
            /* ✅ NAVIGATION VARIABLES */
            --nav-height: 70px;
            --nav-bg: rgba(10, 10, 12, 0.95);
            --border: rgba(212, 175, 55, 0.2);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', sans-serif; user-select: none; }
        
        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding-top: calc(var(--nav-height) + 20px);
            background-image: radial-gradient(circle at top right, rgba(212, 175, 55, 0.05), transparent 50%);
            overflow-x: hidden;
        }

        /* ✅ UNIFIED NAVIGATION BAR STYLES */
        nav {
            position: fixed; top: 0; left: 0; width: 100%; height: var(--nav-height);
            background: var(--nav-bg); backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border); z-index: 1000;
            display: flex; align-items: center; justify-content: space-between; padding: 0 5%;
        }
        .nav-logo { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--accent); font-weight: 700; font-size: 1.2rem; }
        .nav-logo img { width: 32px; height: 32px; border-radius: 50%; border: 1px solid var(--accent); }
        .nav-links { display: flex; gap: 1.5rem; list-style: none; align-items: center; }
        .nav-links a { color: var(--text-secondary); text-decoration: none; font-size: 0.9rem; font-weight: 500; transition: color 0.3s; }
        .nav-links a:hover, .nav-links a.active { color: var(--accent); }
        .btn-signin { display: inline-flex !important; align-items: center; gap: 8px; padding: 0.6rem 1.5rem !important; border: 1px solid var(--accent); border-radius: 50px; color: var(--accent) !important; text-decoration: none; font-weight: 600; font-size: 0.9rem; transition: all 0.3s ease; white-space: nowrap; }
        .btn-signin:hover { background: var(--accent); color: var(--bg-primary) !important; box-shadow: 0 0 15px rgba(212, 175, 55, 0.3); }
        .mobile-menu-btn { display: none; background: none; border: none; color: var(--text-primary); font-size: 1.5rem; cursor: pointer; }

        /* ✅ BACK TO MAIN PAGE BUTTON (TOP RIGHT) */
        .back-to-main-btn {
            position: fixed;
            top: calc(var(--nav-height) + 15px);
            right: 5%;
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 18px;
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--accent);
            border-radius: 50px;
            color: var(--accent);
            text-decoration: none;
            font-size: 0.8rem;
            font-weight: 600;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            z-index: 900;
        }
        .back-to-main-btn:hover {
            background: var(--accent);
            color: var(--bg-primary);
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(212, 175, 55, 0.3);
        }
        .back-to-main-btn i { font-size: 0.85rem; }

        /* ✅ GAME CONTAINER STYLES */
        .game-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 15px;
            width: 100%;
            max-width: 400px;
            padding: 0 20px;
            position: relative;
        }

        .game-header { text-align: center; }
        .game-header h1 {
            font-size: 1.8rem; color: var(--accent); text-transform: uppercase;
            letter-spacing: 2px; margin-bottom: 5px; text-shadow: 0 0 10px rgba(212, 175, 55, 0.3);
        }

        /* ✅ STATS BAR */
        .stats-bar {
            display: flex;
            justify-content: space-around;
            width: 100%;
            background: rgba(212, 175, 55, 0.05);
            border: 1px solid var(--border);
            border-radius: 50px;
            padding: 8px 15px;
            font-size: 0.85rem;
            font-weight: 600;
        }
        .stat-item span { color: var(--accent-light); margin-left: 4px; }

        /* ✅ CANVAS AREA */
        #game-canvas {
            width: 100%;
            max-width: 360px;
            aspect-ratio: 1 / 1;
            background: #050b14;
            border: 4px double var(--accent);
            border-radius: 8px;
            box-shadow: inset 0 0 30px rgba(0,0,0,0.8), 0 0 20px rgba(212, 175, 55, 0.15);
            touch-action: none;
        }

        /* ✅ MOBILE CONTROLS */
        .controls-area {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 8px;
            width: 100%;
            max-width: 200px;
            margin-top: 10px;
        }

        .ctrl-btn {
            background: rgba(212, 175, 55, 0.1);
            border: 1px solid var(--border);
            border-radius: 10px;
            color: var(--accent);
            padding: 12px 0;
            font-size: 1.2rem;
            cursor: pointer;
            transition: all 0.2s;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .ctrl-btn:active { background: var(--accent); color: var(--bg-primary); transform: scale(0.95); }
        .ctrl-btn.up { grid-column: 2; grid-row: 1; }
        .ctrl-btn.left { grid-column: 1; grid-row: 2; }
        .ctrl-btn.down { grid-column: 2; grid-row: 2; }
        .ctrl-btn.right { grid-column: 3; grid-row: 2; }

        /* ✅ ACTION BUTTON */
        .action-btn {
            margin-top: 15px; padding: 10px 30px;
            background: linear-gradient(135deg, var(--accent) 0%, var(--accent-light) 100%);
            color: var(--bg-primary); border: none; border-radius: 50px;
            font-size: 1rem; font-weight: 800; cursor: pointer;
            transition: all 0.3s ease; box-shadow: 0 4px 15px rgba(212, 175, 55, 0.4);
            display: flex; align-items: center; gap: 8px;
        }
        .action-btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(212, 175, 55, 0.5); }

        .controls-hint { font-size: 0.7rem; color: var(--text-secondary); opacity: 0.6; margin-top: 5px; text-align: center;}

        /* ✅ OVERLAY */
        #overlay {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(10, 22, 40, 0.9);
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 20;
            border-radius: 8px;
            backdrop-filter: blur(5px);
            text-align: center;
        }
        #overlay.active { display: flex; animation: fadeIn 0.3s ease-out; }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: scale(0.95); }
            to { opacity: 1; transform: scale(1); }
        }

        #overlay h2 { color: var(--accent); font-size: 2rem; margin-bottom: 10px; text-shadow: 0 0 20px var(--accent); }
        #overlay p { color: #fff; font-size: 1rem; margin-bottom: 20px; }

        @media (max-width: 768px) {
            .nav-links { display: none; } .mobile-menu-btn { display: block; }
            .game-header h1 { font-size: 1.4rem; } 
            .game-wrapper { max-width: 95%; }
            .back-to-main-btn { top: calc(var(--nav-height) + 10px); right: 15px; padding: 6px 14px; font-size: 0.7rem; }
        }
    </style>
</head>
<body>

    <!-- ✅ NAVIGATION BAR WITH FULL LINKS -->
    <nav>
        <a href="https://sbmousavices.github.io/Industrial-Tools/EnglishInfo.html" class="nav-logo">
            <img src="https://sbmousavices.github.io/Industrial-Tools/icon-192.png" alt="BM Planning Logo"><span>Home</span>
        </a>
        <ul class="nav-links">
            <li><a href="https://sbmousavices.github.io/Resume/Resume_Builder_English.html">Resume Builder</a></li>
            <li><a href="https://sbmousavices.github.io/Theme/index.html">Web Design</a></li>
            <li><a href="https://sbmousavices.github.io/NFT/">NFT Gallery</a></li>
            <li><a href="https://sbmousavices.github.io/Industrial-Tools/">Products</a></li>
            <li><a href="https://sbmousavices.github.io/Articles/">Articles</a></li>
            <li><a href="https://sbmousavices.github.io/Industrial-Tools/Community.html">Community</a></li>
            <li><a href="hub.html" class="active">Hub</a></li>
            <li><a href="https://sbmousavices.github.io/Industrial-Tools/EnglishInfo.html#contact">Contact</a></li>
            <li><a href="https://sbmousavices.github.io/Industrial-Tools/EnglishInfo.html" class="btn-signin"><i class="fas fa-user"></i> Sign In</a></li>
        </ul>
        <button class="mobile-menu-btn"><i class="fas fa-bars"></i></button>
    </nav>

    <!-- ✅ BACK TO MAIN PAGE BUTTON (TOP RIGHT) -->
    <a href="https://sbmousavices.github.io/Community-Hub/game-index.html" class="back-to-main-btn">
        <i class="fas fa-arrow-left"></i> Back to Main Page
    </a>

    <!-- ✅ GAME AREA -->
    <div class="game-wrapper">
        <div class="game-header">
            <h1><i class="fas fa-snake"></i> Gold Snake</h1>
        </div>

        <div class="stats-bar">
            <div class="stat-item">Score: <span id="score">0</span></div>
            <div class="stat-item">Best: <span id="best-score">0</span></div>
        </div>
        
        <canvas id="game-canvas" width="360" height="360"></canvas>

        <!-- Mobile Controls -->
        <div class="controls-area">
            <div class="ctrl-btn up" onclick="changeDirection('UP')"><i class="fas fa-arrow-up"></i></div>
            <div class="ctrl-btn left" onclick="changeDirection('LEFT')"><i class="fas fa-arrow-left"></i></div>
            <div class="ctrl-btn down" onclick="changeDirection('DOWN')"><i class="fas fa-arrow-down"></i></div>
            <div class="ctrl-btn right" onclick="changeDirection('RIGHT')"><i class="fas fa-arrow-right"></i></div>
        </div>

        <button id="startBtn" class="action-btn"><i class="fas fa-play"></i> Start Game</button>
        <div class="controls-hint">Use Arrow Keys or Buttons to Move • Wrap-around Enabled!</div>

        <!-- Overlay -->
        <div id="overlay">
            <h2>GAME OVER</h2>
            <p>Final Score: <span id="final-score">0</span></p>
            <button id="restartBtn" class="action-btn"><i class="fas fa-redo"></i> Play Again</button>
        </div>
    </div>

    <!-- ✅ JAVASCRIPT LOGIC -->
    <script>
        const canvas = document.getElementById('game-canvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestScoreEl = document.getElementById('best-score');
        const finalScoreEl = document.getElementById('final-score');
        const startBtn = document.getElementById('startBtn');
        const restartBtn = document.getElementById('restartBtn');
        const overlay = document.getElementById('overlay');

        // Game Settings
        const gridSize = 18;
        const tileCount = canvas.width / gridSize;
        
        let snake = [];
        let food = {};
        let dx = 0;
        let dy = 0;
        let score = 0;
        let bestScore = localStorage.getItem('goldSnakeBest') || 0;
        let gameLoop;
        let speed = 150; // ✅ REDUCED FROM 120 TO 150 FOR SLOWER START
        let isGameRunning = false;

        bestScoreEl.innerText = bestScore;

        function initGame() {
            snake = [{x: 10, y: 10}, {x: 9, y: 10}, {x: 8, y: 10}];
            dx = 1; dy = 0;
            score = 0;
            speed = 150; // Reset speed on new game
            scoreEl.innerText = score;
            placeFood();
            overlay.classList.remove('active');
            startBtn.style.display = 'none';
            isGameRunning = true;
            if(gameLoop) clearInterval(gameLoop);
            gameLoop = setInterval(update, speed);
        }

        function placeFood() {
            food = {
                x: Math.floor(Math.random() * tileCount),
                y: Math.floor(Math.random() * tileCount)
            };
            for(let part of snake) {
                if(part.x === food.x && part.y === food.y) placeFood();
            }
        }

        function update() {
            const head = {x: snake[0].x + dx, y: snake[0].y + dy};

            // ✅ WRAP-AROUND LOGIC (REPLACED WALL COLLISION)
            if(head.x < 0) head.x = tileCount - 1;
            if(head.x >= tileCount) head.x = 0;
            if(head.y < 0) head.y = tileCount - 1;
            if(head.y >= tileCount) head.y = 0;

            // Self Collision Check Only
            for(let part of snake) {
                if(head.x === part.x && head.y === part.y) {
                    gameOver(); return;
                }
            }

            snake.unshift(head);

            // Eat Food
            if(head.x === food.x && head.y === food.y) {
                score += 10;
                scoreEl.innerText = score;
                placeFood();
                
                // Increase Speed Gradually
                if(speed > 60) {
                    speed -= 3;
                    clearInterval(gameLoop);
                    gameLoop = setInterval(update, speed);
                }
            } else {
                snake.pop();
            }

            draw();
        }

        function draw() {
            // Clear Canvas
            ctx.fillStyle = '#050b14';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Draw Grid (Subtle)
            ctx.strokeStyle = 'rgba(212, 175, 55, 0.05)';
            ctx.lineWidth = 1;
            for(let i=0; i<tileCount; i++) {
                ctx.beginPath(); ctx.moveTo(i*gridSize, 0); ctx.lineTo(i*gridSize, canvas.height); ctx.stroke();
                ctx.beginPath(); ctx.moveTo(0, i*gridSize); ctx.lineTo(canvas.width, i*gridSize); ctx.stroke();
            }

            // Draw Food
            ctx.fillStyle = '#ef4444';
            ctx.shadowBlur = 10;
            ctx.shadowColor = '#ef4444';
            ctx.beginPath();
            ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI*2);
            ctx.fill();
            ctx.shadowBlur = 0;

            // Draw Snake
            snake.forEach((part, index) => {
                ctx.fillStyle = index === 0 ? '#f4d06f' : '#d4af37';
                if(index === 0) {
                    ctx.shadowBlur = 8;
                    ctx.shadowColor = '#d4af37';
                } else {
                    ctx.shadowBlur = 0;
                }
                
                ctx.fillRect(part.x * gridSize + 1, part.y * gridSize + 1, gridSize - 2, gridSize - 2);
                
                // Eyes for head
                if(index === 0) {
                    ctx.fillStyle = '#0a1628';
                    const eyeSize = 3;
                    if(dx === 1) { // Right
                        ctx.fillRect(part.x * gridSize + gridSize - 6, part.y * gridSize + 4, eyeSize, eyeSize);
                        ctx.fillRect(part.x * gridSize + gridSize - 6, part.y * gridSize + gridSize - 7, eyeSize, eyeSize);
                    } else if(dx === -1) { // Left
                        ctx.fillRect(part.x * gridSize + 3, part.y * gridSize + 4, eyeSize, eyeSize);
                        ctx.fillRect(part.x * gridSize + 3, part.y * gridSize + gridSize - 7, eyeSize, eyeSize);
                    } else if(dy === -1) { // Up
                        ctx.fillRect(part.x * gridSize + 4, part.y * gridSize + 3, eyeSize, eyeSize);
                        ctx.fillRect(part.x * gridSize + gridSize - 7, part.y * gridSize + 3, eyeSize, eyeSize);
                    } else { // Down
                        ctx.fillRect(part.x * gridSize + 4, part.y * gridSize + gridSize - 6, eyeSize, eyeSize);
                        ctx.fillRect(part.x * gridSize + gridSize - 7, part.y * gridSize + gridSize - 6, eyeSize, eyeSize);
                    }
                }
            });
            ctx.shadowBlur = 0;
        }

        function changeDirection(dir) {
            if(!isGameRunning) return;
            if(dir === 'UP' && dy !== 1) { dx = 0; dy = -1; }
            if(dir === 'DOWN' && dy !== -1) { dx = 0; dy = 1; }
            if(dir === 'LEFT' && dx !== 1) { dx = -1; dy = 0; }
            if(dir === 'RIGHT' && dx !== -1) { dx = 1; dy = 0; }
        }

        function gameOver() {
            isGameRunning = false;
            clearInterval(gameLoop);
            if(score > bestScore) {
                bestScore = score;
                localStorage.setItem('goldSnakeBest', bestScore);
                bestScoreEl.innerText = bestScore;
            }
            finalScoreEl.innerText = score;
            overlay.classList.add('active');
        }

        // Keyboard Input
        document.addEventListener('keydown', e => {
            if(e.key === 'ArrowUp') changeDirection('UP');
            if(e.key === 'ArrowDown') changeDirection('DOWN');
            if(e.key === 'ArrowLeft') changeDirection('LEFT');
            if(e.key === 'ArrowRight') changeDirection('RIGHT');
        });

        // Button Listeners
        startBtn.addEventListener('click', initGame);
        restartBtn.addEventListener('click', initGame);

        // Initial Draw
        draw();
    </script>
</body>
